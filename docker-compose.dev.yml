# Dev helpers: LiveKit + Redis only (use with `npm run dev` on the host).
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-local_dev_only_secret_do_not_use_in_prod}
      LIVEKIT_USE_EXTERNAL_IP: "false"
      LIVEKIT_RTC_PORT_START: "50000"
      LIVEKIT_RTC_PORT_END: "50100"
      LIVEKIT_LOG_LEVEL: info
      LIVEKIT_REDIS_ADDRESS: redis:6379
    volumes:
      - ./deploy/livekit-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - meet-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  meet-dev-redis:
