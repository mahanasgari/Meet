# MiniPlayer Iran edge (nginx on the Iran server, next to the VPN's haproxy).
# Iranian listeners get songs from inside Iran: each song is fetched once from
# home (through Cloudflare, the only route that works from Iran) and kept on
# disk; every later play is served from here. Everything else passes through.
# Install: /etc/nginx/conf.d/mpedge.conf, cache dirs below, `nginx -t && systemctl reload nginx`.

proxy_cache_path /var/cache/mpedge/songs levels=1:2 keys_zone=mp_songs:20m
                 max_size=15g inactive=60d use_temp_path=off;
proxy_cache_path /var/cache/mpedge/auth keys_zone=mp_auth:2m max_size=20m inactive=1h;

log_format mpedge '$time_iso8601 $status $body_bytes_sent $request_time $upstream_cache_status "$uri"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/mpedge.log mpedge;

    proxy_ssl_server_name on;
    proxy_ssl_name music.cloudproducts.ir;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host music.cloudproducts.ir;
    proxy_connect_timeout 15s;
    resolver 127.0.0.53 valid=300s ipv6=off;   # IPv6 to Cloudflare doesn't work from here
    set $home music.cloudproducts.ir;

    location = /extractor/health {
        default_type application/json;
        return 200 '{"ok":true,"edge":"iran"}';
    }

    # Is this listener's token valid? Asked at home, answer kept 10 minutes.
    location = /_auth {
        internal;
        proxy_pass https://$home/extractor/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Range "";
        proxy_cache mp_auth;
        proxy_cache_key $http_authorization;
        proxy_cache_valid 204 10m;
        proxy_cache_valid 401 403 1m;
        proxy_ignore_headers Cache-Control Expires;
    }

    location = /extractor/audio {
        auth_request /_auth;
        proxy_pass https://$home/extractor/audio$is_args$args;
        proxy_set_header Range "";          # always the whole song, once
        proxy_cache mp_songs;
        proxy_cache_key "$arg_url|$arg_q";
        proxy_cache_valid 200 60d;
        proxy_cache_lock on;                # a second listener waits for the first fetch
        proxy_cache_lock_timeout 90s;
        proxy_cache_lock_age 90s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location /extractor/ {
        proxy_pass https://$home;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location / { return 404; }
}
