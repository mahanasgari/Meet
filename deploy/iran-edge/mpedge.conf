# MiniPlayer Iran edge (nginx on the Iran server, next to the VPN's haproxy).
# Iranian listeners get songs from inside Iran: each song is fetched once from
# Germany's music bot through an SSH tunnel (mpedge-tunnel.service; Iran's
# filtering cuts large HTTPS downloads and blocks our Cloudflare names) and kept
# on disk; every later play is served from here. Everything else passes through
# to Germany, which hands home-only requests on to home itself.
# Install: /etc/nginx/conf.d/mpedge.conf, cache dirs below, `nginx -t && systemctl reload nginx`.
# Certificate: certbot certonly --webroot -w /var/www/acme -d ir.buymepizza.ir (renews by the certbot timer).
# App URL: https://ir.buymepizza.ir:8090/extractor (label "Iran" in servers.json).

proxy_cache_path /var/cache/mpedge/songs levels=1:2 keys_zone=mp_songs:20m
                 max_size=15g inactive=60d use_temp_path=off;
proxy_cache_path /var/cache/mpedge/auth keys_zone=mp_auth:2m max_size=20m inactive=1h;

# Is the listener on an Iranian address? (apps then prefer this server)
geo $mp_iran {
    default false;
    include /etc/nginx/mpedge-ir.conf;   # deploy/iran-edge/mpedge-ir.conf
}

upstream mp_de {
    server 127.0.0.1:14100;     # Germany's music bot through mpedge-tunnel
    keepalive 8;
}

map $http_authorization $mp_hdr { "" 0; default 1; }
map $arg__h $mp_qh { "" 0; default 1; }
log_format mpedge '$time_iso8601 $remote_addr iran=$mp_iran $status $body_bytes_sent $request_time $upstream_cache_status "$uri" hdr=$mp_hdr h=$mp_qh "$http_user_agent"';

# Port 80: certificate renewals only (no tokens in clear text).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /extractor/health {
        default_type application/json;
        return 200 '{"ok":true,"edge":"iran"}';
    }
    location / { return 404; }
}

# Port 8090 HTTPS (443 belongs to the VPN's haproxy).
server {
    listen 8090 ssl http2 default_server;
    listen [::]:8090 ssl http2 default_server;
    server_name ir.buymepizza.ir;
    ssl_certificate /etc/letsencrypt/live/ir.buymepizza.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ir.buymepizza.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mpedge:5m;
    access_log /var/log/nginx/mpedge.log mpedge;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;   # the bot trusts X-Real-IP first: don't pass a client's own
    proxy_connect_timeout 10s;

    # Answers only while Germany answers through the tunnel, so apps skip
    # this server when the tunnel is down.
    location = /extractor/health {
        proxy_pass http://mp_de/health;
        proxy_read_timeout 8s;
    }

    location = /extractor/whereami {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"iran":$mp_iran}';
    }

    # Is this listener's token valid? Asked in Germany, answer kept 10 minutes.
    location = /_auth {
        internal;
        proxy_pass http://mp_de/auth/check?_h=$mp_h;   # the web app packs its token in _h
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Range "";
        proxy_cache mp_auth;
        proxy_cache_key "$http_authorization|$http_x_music_token|$mp_h";  # the bot accepts either header
        proxy_cache_valid 204 10m;
        proxy_cache_valid 401 403 1m;
        proxy_ignore_headers Cache-Control Expires;
    }

    location = /extractor/audio {
        set $mp_h $arg__h;                  # shared with the /_auth subrequest
        auth_request /_auth;
        proxy_pass http://mp_de/audio$is_args$args;
        proxy_set_header Range "";          # always the whole song, once
        proxy_cache mp_songs;
        proxy_cache_key "$arg_url|$arg_q";
        proxy_cache_valid 200 60d;
        proxy_cache_lock on;                # a second listener waits for the first fetch
        proxy_cache_lock_timeout 90s;
        proxy_cache_lock_age 90s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location /extractor/ {
        proxy_pass http://mp_de/;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location / { return 404; }
}
