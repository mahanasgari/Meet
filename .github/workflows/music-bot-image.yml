name: music-bot image
on:
  push:
    branches: [main]
    paths: ["music-bot/**", ".github/workflows/music-bot-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: music-bot
          push: true
          tags: ghcr.io/mahanasgari/meet-music-bot:latest
