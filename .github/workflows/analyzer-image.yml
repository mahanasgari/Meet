name: music-analyzer image
on:
  push:
    branches: [main]
    paths: ["analyzer/**", ".github/workflows/analyzer-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: analyzer
          push: true
          tags: ghcr.io/mahanasgari/music-analyzer:latest
